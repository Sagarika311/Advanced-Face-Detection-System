<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Face Detection System (Web)</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f3f4f6; margin:0; padding:20px; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 16px; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.06);}
    h1 { margin-top:0 }
    .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    .controls button, .controls input { padding:8px 12px; border-radius:6px; border:1px solid #ddd; background:#fff; cursor:pointer;}
    .video { display:flex; gap:16px; align-items:flex-start; }
    .sidebar { width: 260px; }
    .gallery { display:flex; gap:8px; flex-wrap:wrap; padding:8px; border:1px dashed #ddd; border-radius:6px; height:120px; overflow:auto; background:#fafafa; }
    .thumbnail img { width:100px; height:100px; object-fit:cover; border-radius:6px; border:1px solid #ccc;}
    .stats { margin-top:8px; font-size:14px; color:#333;}
    .label { font-weight:600; margin-right:6px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Face Detection System — Web Demo</h1>

    <div class="controls">
      <button id="toggleBtn">Toggle Detection</button>
      <button id="captureBtn">Capture Faces</button>
      <button id="clearBtn">Clear Captures</button>

      <div style="display:flex;align-items:center;">
        <span class="label">Confidence</span>
        <input id="confSlider" type="range" min="10" max="99" value="50">
        <span id="confVal">0.50</span>
      </div>

      <div style="margin-left:auto;">
        <span id="fps">FPS: —</span> • <span id="faces">Faces: —</span>
      </div>
    </div>

    <div class="video">
      <div>
        <img id="videoFrame" src="/video_feed" width="640" height="480" style="border-radius:6px; border:1px solid #ccc;">
      </div>

      <div class="sidebar">
        <h3>Captured Faces</h3>
        <div class="gallery" id="gallery"></div>
        <div class="stats" id="info">Status: —</div>
      </div>
    </div>
  </div>

<script>
async function postJSON(url, body = {}) {
  const res = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  return res.json();
}

async function refreshStats(){
  const r = await fetch("/stats");
  const j = await r.json();
  document.getElementById("fps").innerText = "FPS: " + j.fps;
  document.getElementById("faces").innerText = "Faces: " + j.faces;
  document.getElementById("info").innerText = "Detection: " + (j.face_detection_active ? "ON" : "OFF") + " • Confidence: " + j.confidence_threshold.toFixed(2);
}

async function refreshGallery(){
  const r = await fetch("/thumbnails");
  const arr = await r.json();
  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";
  for(const item of arr){
    const div = document.createElement("div");
    div.className = "thumbnail";
    const a = document.createElement("a");
    a.href = item.url;
    a.target = "_blank";
    const img = document.createElement("img");
    img.src = item.url;
    img.title = item.name;
    a.appendChild(img);
    div.appendChild(a);
    gallery.appendChild(div);
  }
}

document.getElementById("toggleBtn").addEventListener("click", async ()=>{
  const res = await postJSON("/toggle_detection");
  document.getElementById("info").innerText = "Detection: " + (res.face_detection_active ? "ON" : "OFF");
});

document.getElementById("captureBtn").addEventListener("click", async ()=>{
  const res = await postJSON("/capture_faces");
  alert("Saved: " + res.saved);
  await refreshGallery();
});

document.getElementById("clearBtn").addEventListener("click", async ()=>{
  const res = await postJSON("/clear_captures");
  alert("Removed: " + res.removed);
  await refreshGallery();
});

const slider = document.getElementById("confSlider");
const confVal = document.getElementById("confVal");
slider.addEventListener("input", async ()=>{
  const val = slider.value;
  const scaled = (val/100).toFixed(2);
  confVal.innerText = scaled;
  await postJSON("/set_confidence", {value: scaled});
});

setInterval(refreshStats, 1000);
setInterval(refreshGallery, 1500);
window.onload = () => {
  refreshStats();
  refreshGallery();
};
</script>
</body>
</html>
